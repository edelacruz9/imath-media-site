<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>iMath Media Booking Manager</title><style>:root{--bg:#0B0B0D;--p1:#121216;--p2:#18181D;--p3:#202027;--ln:#2A2A32;--tx:#F3F4F6;--mu:#9AA0AA;--mu2:#6B7280;--bl:#007BFF;--bl2:#1E3A8A;--ok:#22C55E;--wn:#F59E0B;--er:#EF4444;--r:12px;--f:Montserrat,Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--bl);text-decoration:none}a:hover{text-decoration:underline}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em}h2{font-size:16px;font-weight:700}h3{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.mu{color:var(--mu)}.sm{font-size:12px}.b{font-weight:700}.r{text-align:right}.c{text-align:center}.nw{white-space:nowrap}.hide{display:none!important}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* shell */
#app{display:flex;min-height:100%}
#side{width:236px;flex:none;background:var(--p1);border-right:1px solid var(--ln);padding:18px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
#side .logo{padding:4px 8px 18px}#side .logo svg{height:46px;width:auto;display:block}
#side nav{display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1}
.nv{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--mu);cursor:pointer;border:0;background:none;text-align:left;width:100%}
.nv:hover{background:var(--p2);color:var(--tx)}.nv.on{background:var(--bl2);color:#fff}
.nv .bd{margin-left:auto;background:var(--bl);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
#side .who{border-top:1px solid var(--ln);padding:12px 8px 0;font-size:12px;color:var(--mu)}#side .who b{color:var(--tx);display:block;overflow:hidden;text-overflow:ellipsis}
#main{flex:1;min-width:0;padding:26px 30px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}.top h1{margin-right:auto}
#mbar{display:none}
/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--ln);background:var(--p2);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--p3)}.btn.pri{background:var(--bl);border-color:var(--bl);color:#fff}.btn.pri:hover{filter:brightness(1.1)}
.btn.dng{border-color:#5b2020;color:#fca5a5}.btn.dng:hover{background:#2a1212}.btn.sm{padding:5px 10px;font-size:12px}.btn.gh{background:none}.btn[disabled]{opacity:.45;pointer-events:none}
input,select,textarea{background:var(--p1);border:1px solid var(--ln);border-radius:9px;padding:8px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--bl);box-shadow:0 0 0 3px rgba(0,123,255,.18)}
input[type=checkbox]{width:auto;accent-color:var(--bl)}input[disabled],select[disabled],textarea[disabled]{opacity:.6}
textarea{resize:vertical;min-height:70px}label.f{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:12px 0 5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.card{background:var(--p1);border:1px solid var(--ln);border-radius:var(--r);padding:16px}.card h2{margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--p1);border:1px solid var(--ln);border-radius:var(--r);padding:14px 16px;cursor:default}.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--bl)}
.kpi .l{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}.kpi .v{font-size:26px;font-weight:700;margin-top:4px}.kpi .s{font-size:12px;color:var(--mu);margin-top:2px}
.kpi.warn .v{color:var(--wn)}.kpi.bad .v{color:var(--er)}.kpi.good .v{color:var(--ok)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--ln);background:var(--p1);padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;color:var(--mu)}
.chip.on{background:var(--bl);border-color:var(--bl);color:#fff}.chip i{font-style:normal;opacity:.75;margin-left:5px}
/* table */
.tw{background:var(--p1);border:1px solid var(--ln);border-radius:var(--r);overflow:auto}
table{width:100%;border-collapse:collapse}th{position:sticky;top:0;background:var(--p2);text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);padding:10px 12px;white-space:nowrap}
td{padding:11px 12px;border-top:1px solid var(--ln);vertical-align:top}tbody tr.ck{cursor:pointer}tbody tr.ck:hover{background:var(--p2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.empty{padding:34px;text-align:center;color:var(--mu)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.s-new{background:rgba(0,123,255,.16);color:#6db3ff}.s-confirmed{background:rgba(56,189,248,.16);color:#7dd3fc}.s-assigned{background:rgba(167,139,250,.16);color:#c4b5fd}
.s-shot{background:rgba(245,158,11,.16);color:#fbbf24}.s-editing{background:rgba(249,115,22,.16);color:#fb923c}.s-delivered{background:rgba(34,197,94,.16);color:#4ade80}.s-cancelled{background:rgba(107,114,128,.2);color:#9ca3af}
.s-draft{background:rgba(107,114,128,.2);color:#9ca3af}.s-sent{background:rgba(0,123,255,.16);color:#6db3ff}.s-paid{background:rgba(34,197,94,.16);color:#4ade80}.s-void{background:rgba(107,114,128,.2);color:#9ca3af;text-decoration:line-through}
.s-pending{background:rgba(245,158,11,.16);color:#fbbf24}.s-approved{background:rgba(0,123,255,.16);color:#6db3ff}.s-overdue{background:rgba(239,68,68,.16);color:#f87171}
.s-active{background:rgba(34,197,94,.16);color:#4ade80}.s-paused{background:rgba(245,158,11,.16);color:#fbbf24}.s-inactive{background:rgba(107,114,128,.2);color:#9ca3af}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11px;font-weight:600;background:var(--p3);color:var(--mu);margin:0 4px 3px 0}.tag.ok{background:rgba(34,197,94,.14);color:#4ade80}.tag.no{background:rgba(239,68,68,.14);color:#f87171}.tag.wn{background:rgba(245,158,11,.16);color:#fbbf24}
.warnbox{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.4);color:#fbbf24;border-radius:10px;padding:8px 11px;font-size:12.5px;margin:6px 0}.warnbox.bad{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4);color:#f87171}.okbox{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.35);color:#4ade80;border-radius:10px;padding:8px 11px;font-size:12.5px;margin:6px 0}
/* drawer + modal */
#shade{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}#shade.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;height:100%;width:min(620px,100%);background:var(--p1);border-left:1px solid var(--ln);z-index:41;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column}#drawer.on{transform:none}
#drawer .dh{padding:16px 20px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:12px}#drawer .dh h2{margin-right:auto}
#drawer .db{padding:6px 20px 20px;overflow:auto;flex:1}#drawer .df{padding:12px 20px;border-top:1px solid var(--ln);display:flex;gap:10px;background:var(--p1)}
.sec{margin-top:22px}.sec>h3{margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--ln)}
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.65)}#modal.on{display:flex}
#modal .mb{background:var(--p1);border:1px solid var(--ln);border-radius:14px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:20px}#modal .mb h2{margin-bottom:6px}#modal .ma{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}.toast{background:var(--p3);border:1px solid var(--ln);padding:10px 16px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.5);font-weight:600;max-width:90vw}.toast.er{border-color:var(--er);color:#fca5a5}.toast.ok{border-color:var(--ok)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden;background:var(--p1)}
.cal .dow{background:var(--p2);padding:8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);text-align:center}
.cal .day{min-height:112px;border-top:1px solid var(--ln);border-left:1px solid var(--ln);padding:6px;cursor:pointer;position:relative}.cal .day:nth-child(7n+1){border-left:0}.cal .day:hover{background:var(--p2)}
.cal .day.out{opacity:.4}.cal .day.today .dn{background:var(--bl);color:#fff}.cal .day.blk{background:repeating-linear-gradient(45deg,rgba(239,68,68,.08),rgba(239,68,68,.08) 6px,transparent 6px,transparent 12px)}
.dn{display:inline-block;min-width:22px;text-align:center;border-radius:999px;font-weight:700;font-size:12px;padding:1px 5px}
.ev{display:block;font-size:11.5px;padding:2px 6px;border-radius:6px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;border-left:3px solid var(--bl);background:var(--p3)}
.ev.s-new{border-color:var(--bl)}.ev.s-confirmed{border-color:#38bdf8}.ev.s-assigned{border-color:#a78bfa}.ev.s-shot{border-color:#f59e0b}.ev.s-editing{border-color:#f97316}.ev.s-delivered{border-color:#22c55e}.ev.s-cancelled{border-color:#6b7280;opacity:.5}
.ev.cf{outline:1px solid var(--er)}
.tl{display:grid;border:1px solid var(--ln);border-radius:var(--r);overflow:auto;background:var(--p1)}
.tl .hd{background:var(--p2);padding:8px;font-weight:700;font-size:12px;text-align:center;border-left:1px solid var(--ln);position:sticky;top:0;z-index:2}
.tl .hr{position:relative;font-size:11px;color:var(--mu);text-align:right;padding-right:6px}
.tl .col{position:relative;border-left:1px solid var(--ln);background-image:linear-gradient(var(--ln) 1px,transparent 1px);background-size:100% 52px;cursor:cell}
.tl .col.blk{background-color:rgba(239,68,68,.07)}
.tl .blkcard{position:absolute;left:3px;right:3px;border-radius:8px;padding:4px 7px;font-size:11.5px;overflow:hidden;cursor:pointer;background:var(--p3);border-left:3px solid var(--bl);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.tl .blkcard.s-new{border-color:var(--bl)}.tl .blkcard.s-confirmed{border-color:#38bdf8}.tl .blkcard.s-assigned{border-color:#a78bfa}.tl .blkcard.s-shot{border-color:#f59e0b}.tl .blkcard.s-editing{border-color:#f97316}.tl .blkcard.s-delivered{border-color:#22c55e}.tl .blkcard.cf{outline:1px solid var(--er)}
/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow:auto;padding-bottom:10px}
.bcol{background:var(--p1);border:1px solid var(--ln);border-radius:var(--r);padding:10px;min-height:200px}.bcol.over{border-color:var(--bl)}.bcol h3{margin-bottom:8px;display:flex;justify-content:space-between}
.bcard{background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab}.bcard:hover{border-color:var(--bl)}
/* bars */
.bars .br{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;margin:7px 0;font-size:13px}.bars .bt{background:var(--p3);height:12px;border-radius:6px;overflow:hidden}.bars .bf{height:100%;background:linear-gradient(90deg,var(--bl2),var(--bl));border-radius:6px}
.vcols{display:flex;gap:8px;align-items:flex-end;height:170px;padding-top:10px}.vcols .vc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mu)}.vcols .vb{width:100%;max-width:46px;background:linear-gradient(0deg,var(--bl2),var(--bl));border-radius:6px 6px 0 0;min-height:2px}
.vcols .vb.ok{background:linear-gradient(0deg,#166534,var(--ok))}.vcols .vb.er{background:linear-gradient(0deg,#7f1d1d,var(--er))}
.split{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.al{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--ln);cursor:pointer}.al:first-of-type{border-top:0}.al:hover{background:var(--p2)}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--ln);overflow:auto}.tab{padding:9px 14px;cursor:pointer;color:var(--mu);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;background:none;border-top:0;border-left:0;border-right:0}.tab.on{color:var(--tx);border-color:var(--bl)}
.chk{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--ln)}.chk.done span{text-decoration:line-through;color:var(--mu)}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(900px 500px at 50% -10%,#10285a 0%,transparent 70%),var(--bg)}
#login .box{width:min(420px,100%);background:var(--p1);border:1px solid var(--ln);border-radius:16px;padding:30px}#login .lg{display:flex;justify-content:center;margin-bottom:22px}#login .lg svg{height:84px;width:auto}
#login h1{text-align:center;margin-bottom:4px}#login .sub{text-align:center;color:var(--mu);margin-bottom:10px}
/* cg portal */
.cgw{max-width:760px;margin:0 auto;padding:20px 16px 80px}.cgh{display:flex;align-items:center;gap:12px;margin-bottom:18px}.cgh svg{height:38px;width:auto}
.job{background:var(--p1);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}.job .big{font-size:17px;font-weight:700}
.demo{position:fixed;top:0;left:0;right:0;background:var(--wn);color:#111;text-align:center;font-weight:700;font-size:12px;padding:3px;z-index:90}
@media(max-width:900px){#app{display:block}#side{position:fixed;z-index:50;left:0;top:0;transform:translateX(-100%);transition:transform .2s}#side.on{transform:none}#mbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--p1);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:30}#mbar svg.lg{height:30px;width:auto}#main{padding:16px 14px 60px}.g4,.g3{grid-template-columns:1fr 1fr}.split,.two{grid-template-columns:1fr}.bars .br{grid-template-columns:100px 1fr 80px}}
@media print{body{background:#fff;color:#000}}

function loginScreen(mode, msg) {
  mode = mode || 'in';

    '<form id="lf"><label class="f">Email</label><input id="le" type="email" autocomplete="username" required>' + (mode === 'reset' ? '' : '<label class="f">Password' + (mode === 'up' ? ' (at least 10 characters)' : '') + '</label><input id="lp" type="password" autocomplete="' + (mode === 'up' ? 'new-password' : 'current-password') + '" minlength="' + (mode === 'up' ? 10 : 1) + '" required>') +
    '<button class="btn pri" style="width:100%;justify-content:center;margin-top:18px" type="submit">' + { in: 'Sign in', up: 'Create account', reset: 'Send reset email' }[mode] + '</button></form>' +
    '<div class="sm mu c" style="margin-top:16px">' + (mode === 'in' ? '<a data-a="lmode" data-v="reset">Forgot password</a> &nbsp;|&nbsp; <a data-a="lmode" data-v="up">First time setup</a>' : '<a data-a="lmode" data-v="in">Back to sign in</a>') + '</div></div>';
  $('#lf').onsubmit = async e => {

let POLL = null, LASTNEW = null;
async function boot() {
  const mk = $('#mk'); if (DEMO) { SESSION = { access_token: 'demo' }; S.me = { id: 'demo', email: DEMO_ROLE === 'cg' ? 'marcus@example.com' : 'admin@imathinc.com', role: DEMO_ROLE }; mk.innerHTML = '<div class="demo">DEMO MODE: sample data only, nothing is saved to the database</div>'; }
  else {
    SESSION = SESSION || readSess(); if (!SESSION) return loginScreen('in');
    const c = jwtClaims(SESSION.access_token), role = c.app_metadata && c.app_metadata.role;
    if (c.exp && c.exp < Date.now() / 1000) { if (!await refreshSession()) return loginScreen('in'); }
    const cl = jwtClaims(SESSION.access_token); S.me = { id: cl.sub, email: cl.email, role: cl.app_metadata && cl.app_metadata.role };
    if (!S.me.role) { return pendingScreen(S.me.email); }
  }
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  try { await loadAll(); } catch (e) { return loginScreen('in', '!' + e.message); }
  if (S.me.role === 'cg') { $('#app').classList.add('hide'); $('#cgapp').classList.remove('hide'); cgRender(); }

}
async function poll() {
  if (document.hidden || $('#modal').classList.contains('on') || DRAWER) return;

    await loadAll(); const n = S.bookings.filter(b => b.status === 'new').length;

    if (S.me.role !== 'cg' && LASTNEW != null && n > LASTNEW) toast((n - LASTNEW) + ' new booking request' + (n - LASTNEW > 1 ? 's' : ''), 'ok');

}

function bookingFlags(b) {
  const f = [];
  if (b.status !== 'cancelled' && b.status !== 'delivered' && conflicts(b).some(c => c.k === 'cg' || c.k === 'dup' || c.k === 'bo')) f.push(['no', 'Conflict']);
  if (overdueOpen(b)) f.push(['no', 'Late']);
  if (['new', 'confirmed'].includes(b.status) && !b.cg_id && b.shoot_start && (new Date(b.shoot_start) - Date.now()) < 72 * 3600000) f.push(['wn', 'Needs camera pro']);
  return f.map(x => '<span class="tag ' + x[0] + '">' + x[1] + '</span>').join('');
}

function bkFiltered() {
  const now = new Date(), t0 = new Date(ymd(now) + 'T00:00'), q = BK.q.trim().toLowerCase();
  let r = S.bookings.filter(b => {
    if (BK.status === 'open' ? ['delivered', 'cancelled'].includes(b.status) : (BK.status !== 'all' && b.status !== BK.status)) return false;
    if (BK.cg === 'none' ? b.cg_id : (BK.cg && b.cg_id !== BK.cg)) return false;
    if (q && !(b.ref + ' ' + b.contact_name + ' ' + b.contact_email + ' ' + b.address + ' ' + (b.contact_phone || '')).toLowerCase().includes(q)) return false;
    const d = b.shoot_start ? new Date(b.shoot_start) : null;
    if (BK.range === 'today' && !(d && ymd(d) === ymd(now))) return false;
    if (BK.range === 'week' && !(d && d >= t0 && d < addDays(t0, 7))) return false;
    if (BK.range === 'month' && !(d && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear())) return false;
    if (BK.range === 'past' && !(d && d < t0)) return false;
    if (BK.range === 'unsched' && d) return false;
    if (BK.flag === 'cg' && !(['new', 'confirmed'].includes(b.status) && !b.cg_id)) return false;
    if (BK.flag === 'late' && !overdueOpen(b)) return false;
    return true;
  });
  const key = b => new Date(b.shoot_start || (b.requested_date ? b.requested_date + 'T12:00' : b.created_at)).getTime();
  const asc = ['open', 'new', 'confirmed', 'assigned', 'shot', 'editing'].includes(BK.status);
  return r.sort((a, b) => asc ? key(a) - key(b) : key(b) - key(a));
}

  $('#cgapp').innerHTML = '<div class="cgw"><div class="cgh">' + LOGO_M + '<div class="sp"><div class="b">' + esc(me.name || S.me.email) + '</div><div class="sm mu">Camera pro portal</div></div><button class="btn sm" data-a="signout">Sign out</button></div><div class="tabs">' + tabs.map(t => '<button class="tab ' + (CGS.tab === t[0] ? 'on' : '') + '" data-a="cgtab" data-v="' + t[0] + '">' + t[1] + '</button>').join('') + '</div><div id="cgbody">' + CGV[CGS.tab]() + '</div></div>';
}
A.cgtab = el => { CGS.tab = el.dataset.v; cgRender(); };
const CGV = {
  jobs() {
    const mine = S.bookings.filter(b => b.status !== 'cancelled'), open = mine.filter(b => b.status !== 'delivered').sort((a, b) => new Date(a.shoot_start || '2999') - new Date(b.shoot_start || '2999')), done = mine.filter(b => b.status === 'delivered').sort((a, b) => new Date(b.delivered_at || 0) - new Date(a.delivered_at || 0)).slice(0, 5);
    return (open.length ? open.map(jobCard).join('') : '<div class="card empty">No open shoots right now. New assignments appear here.</div>') + (done.length ? '<h3 style="margin:22px 0 10px">Recently delivered</h3>' + done.map(b => '<div class="job"><div class="row"><div class="sp"><div class="b">' + esc(b.address) + '</div><div class="sm mu">' + fmtDateY(b.shoot_start) + ' &middot; ' + esc(pkgName(b.package_code)) + '</div></div>' + sPill(b.status) + '</div></div>').join('') : '');
  },
  pay() {
    const P = S.payouts, yr = new Date().getFullYear(), owed = sum(P.filter(p => ['pending', 'approved'].includes(p.status)), p => p.amount), paid = sum(P.filter(p => p.status === 'paid' && p.paid_at && new Date(p.paid_at).getFullYear() === yr), p => p.amount);
    return '<div class="kpis"><div class="kpi ' + (owed ? 'warn' : '') + '"><div class="l">Owed to you</div><div class="v">' + money(owed) + '</div><div class="s">Pending and approved</div></div><div class="kpi good"><div class="l">Paid in ' + yr + '</div><div class="v">' + money(paid) + '</div></div></div>' + table([{ h: 'Date', f: p => fmtDateY(p.created_at) }, { h: 'For', f: p => esc(p.memo || p.kind) }, { h: 'Status', f: p => pill(p.status, p.status) + (p.paid_at ? '<div class="sm mu">' + fmtDateY(p.paid_at) + (p.method ? ' &middot; ' + esc(p.method) : '') + '</div>' : '') }, { h: 'Amount', cls: 'num', f: p => money(p.amount) }], P, { empty: 'No payouts yet. A payout is created when you mark a shoot delivered.' }) + '<p class="sm mu" style="margin-top:12px">You are an independent contractor and responsible for your own taxes. Keep your own records of these payments.</p>';
  },
  avail() {
    const me = myCg(), av = S.avail.filter(a => a.cg_id === me.id), off = S.blackouts.filter(b => b.cg_id === me.id), gl = S.blackouts.filter(b => !b.cg_id);
    return '<div class="card"><h2>Weekly availability</h2><div class="sm mu" style="margin-bottom:8px">Tell us when you normally work. If every day is off, you may be booked any day.</div>' + WD.map((w, i) => { const a = av.find(x => x.weekday === i); return '<div class="row" style="margin:5px 0"><label class="row" style="width:112px"><input type="checkbox" id="av_on' + i + '"' + (a ? ' checked' : '') + '> ' + w.slice(0, 3) + '</label><div style="width:118px"><input type="time" id="av_s' + i + '" value="' + (a ? hhmm(a.start_time) : '08:00') + '"></div><span class="mu">to</span><div style="width:118px"><input type="time" id="av_e' + i + '" value="' + (a ? hhmm(a.end_time) : '18:00') + '"></div></div>'; }).join('') + '<button class="btn pri" style="margin-top:12px" data-a="cgsaveav">Save availability</button></div>' +
      '<div class="card" style="margin-top:14px"><h2>Time off</h2>' + (off.length ? off.map(o => '<div class="row" style="margin:5px 0"><span class="sp">' + fmtDateY(o.start_date) + (o.end_date !== o.start_date ? ' to ' + fmtDateY(o.end_date) : '') + (o.reason ? ' &middot; ' + esc(o.reason) : '') + '</span><button class="btn sm dng" data-a="cgdeloff" data-id="' + o.id + '">Remove</button></div>').join('') : '<div class="mu sm">No time off scheduled.</div>') + '<div class="g3" style="margin-top:10px"><input type="date" id="off_s"><input type="date" id="off_e"><input id="off_r" placeholder="Reason"></div><button class="btn" style="margin-top:10px" data-a="cgaddoff">Add time off</button></div>' + (gl.length ? '<div class="card" style="margin-top:14px"><h2>Company closed dates</h2>' + gl.map(o => '<div class="sm" style="margin:4px 0">' + fmtDateY(o.start_date) + (o.end_date !== o.start_date ? ' to ' + fmtDateY(o.end_date) : '') + (o.reason ? ' &middot; ' + esc(o.reason) : '') + '</div>').join('') + '</div>' : '');
  }
};
function jobCard(b) {
  const tasks = S.tasks.filter(t => t.booking_id === b.id).sort((a, c) => a.sort - c.sort), dl = S.deliv.filter(d => d.booking_id === b.id), qm = S.baddons.filter(a => a.booking_id === b.id), hl = hoursLeft(b);
  const next = { assigned: ['shot', 'Mark shot'], shot: ['editing', 'Start editing'], editing: ['delivered', 'Mark delivered'] }[b.status];
  return '<div class="job"><div class="row"><div class="sp"><div class="big">' + (b.shoot_start ? fmtDate(b.shoot_start) + ' at ' + fmtTime(b.shoot_start) : 'Time to be set') + '</div><div>' + esc(b.address) + '</div></div>' + sPill(b.status) + '</div>' +
    '<div class="row" style="margin:12px 0"><a class="btn sm" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(b.address) + '">Directions</a>' + (b.contact_phone ? '<a class="btn sm" href="tel:' + esc(b.contact_phone) + '">Call ' + esc((b.contact_name || '').split(' ')[0]) + '</a><a class="btn sm" href="sms:' + esc(b.contact_phone) + '">Text</a>' : '') + '<span class="sp"></span><span class="tag ok">Your pay ' + money(b.cg_fee) + '</span></div>' +
    '<div class="sm"><b>' + esc(pkgName(b.package_code)) + '</b>, ' + esc(bandName(b.size_band_id)) + ' &middot; about ' + b.duration_min + ' minutes' + (b.rush ? ' <span class="tag wn">Rush delivery</span>' : '') + '</div>' + (qm.length ? '<div class="sm mu">Add ons: ' + qm.map(a => esc((S.addons.find(x => x.code === a.addon_code) || {}).name || a.addon_code) + (a.qty > 1 ? ' x' + a.qty : '')).join(', ') + '</div>' : '') +
    (b.access_notes ? '<div class="warnbox" style="margin-top:10px"><b>Access:</b> ' + esc(b.access_notes) + '</div>' : '') + (b.notes ? '<div class="sm" style="margin-top:8px"><b>Client notes:</b> ' + esc(b.notes) + '</div>' : '') +
    (['shot', 'editing'].includes(b.status) && hl != null ? '<div class="' + (hl < 0 ? 'warnbox bad' : (hl < 24 ? 'warnbox' : 'okbox')) + '" style="margin-top:10px">' + (hl < 0 ? 'Past the delivery target by ' + Math.round(-hl) + ' hours.' : Math.round(hl) + ' hours left to deliver (target ' + targetHours(b) + ' hours after the shoot).') + '</div>' : '') +
    (tasks.length ? '<h3 style="margin:14px 0 4px">Checklist</h3>' + tasks.map(t => '<label class="chk ' + (t.done ? 'done' : '') + '"><input type="checkbox" data-a="cgtask" data-id="' + t.id + '"' + (t.done ? ' checked' : '') + '><span>' + esc(t.label) + '</span></label>').join('') : '') +
    '<h3 style="margin:14px 0 4px">Delivery links</h3>' + dl.map(d => '<div class="row" style="margin:5px 0"><a class="sp" target="_blank" rel="noopener" href="' + esc(d.url) + '">' + esc(d.label) + '</a><button class="btn sm dng" data-a="cgdeldl" data-id="' + d.id + '">Remove</button></div>').join('') + (['assigned', 'shot', 'editing'].includes(b.status) ? '<div class="g2" style="margin-top:6px"><input id="cgl_' + b.id + '" placeholder="Label, for example Video"><input id="cgu_' + b.id + '" placeholder="https://"></div><button class="btn sm" style="margin-top:8px" data-a="cgadddl" data-id="' + b.id + '">Add link</button>' : '') +
    (next ? '<button class="btn pri" style="width:100%;justify-content:center;margin-top:16px;padding:12px" data-a="cgstatus" data-id="' + b.id + '" data-s="' + next[0] + '">' + next[1] + '</button>' : '') + '</div>';
}
A.cgstatus = async el => { await run(async () => { await DB.update('bookings', 'id', el.dataset.id, { status: el.dataset.s }); await loadAll(); cgRender(); }, el.dataset.s === 'delivered' ? 'Delivered. Nice work.' : 'Updated'); };
A.cgtask = async el => { const done = el.checked; await run(async () => { await DB.update('booking_tasks', 'id', el.dataset.id, { done, done_at: done ? new Date().toISOString() : null }); const t = S.tasks.find(x => x.id === el.dataset.id); if (t) t.done = done; el.closest('.chk').classList.toggle('done', done); }); };
A.cgadddl = async el => { const id = el.dataset.id, url = ($('#cgu_' + id).value || '').trim(); if (!/^https?:\/\//i.test(url)) return toast('Enter a link that starts with http', 'er'); await run(async () => { await DB.insert('deliveries', { booking_id: id, label: ($('#cgl_' + id).value || '').trim() || 'Delivery', url }); await loadAll(); cgRender(); }, 'Link added'); };
A.cgdeldl = async el => run(async () => { await DB.remove('deliveries', 'id', el.dataset.id); await loadAll(); cgRender(); });
A.cgsaveav = async () => { const me = myCg(); await run(async () => { await DB.removeWhere('cg_availability', 'cg_id=eq.' + me.id); const rows = WD.map((w, i) => val('av_on' + i) ? { cg_id: me.id, weekday: i, start_time: val('av_s' + i) || '08:00', end_time: val('av_e' + i) || '18:00' } : null).filter(Boolean); if (rows.length) await DB.insert('cg_availability', rows); await loadAll(); cgRender(); }, 'Availability saved'); };
A.cgaddoff = async () => { const me = myCg(), s = val('off_s'), e = val('off_e') || s; if (!s) return toast('Pick a start date', 'er'); if (e < s) return toast('End date is before the start', 'er'); await run(async () => { await DB.insert('blackout_dates', { cg_id: me.id, start_date: s, end_date: e, reason: val('off_r').trim() || null }); await loadAll(); cgRender(); }, 'Time off added'); };
A.cgdeloff = async el => run(async () => { await DB.remove('blackout_dates', 'id', el.dataset.id); await loadAll(); cgRender(); });

/* ===== start ===== */
window.addEventListener('hashchange', () => { if (S.me && S.me.role !== 'cg') { const h = location.hash.slice(1); if (VIEWS[h] && navItems().some(n => n[0] === h) && h !== VIEW) go(h); } });
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => boot().then(() => { if (typeof START_HOOK === 'function') START_HOOK(); })); else boot().then(() => { if (typeof START_HOOK === 'function') START_HOOK(); });
</script></body></html>
